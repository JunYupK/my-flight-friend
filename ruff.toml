    "flight_monitor",
    "flight_front/api",
    "./main.py",
    "mcp_server.py",
    "diagnosis_agent.py",
    "scripts",
    "tests/test_deals_cache.py",
    "tests/test_flight_monitor.py",
    "tests/test_materialize_deals.py",
    "tests/test_notifier.py",
    "tests/test_offer_utils.py",
    "tests/test_run_state.py",
    "tests/test_save_deals.py",
